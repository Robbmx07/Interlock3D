<title>Interlock3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f0ea;
    --surface: #ffffff;
    --surface-2: #e9e6dc;
    --border: #d8d4c6;
    --text: #201d17;
    --text-dim: #6b675c;
    --accent: #e2661a;
    --accent-ink: #fff6ee;
    --accent-2: #1f7f92;
    --focus: #1f7f92;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --surface: #1e2126;
      --surface-2: #262a31;
      --border: #33383f;
      --text: #e8e6e1;
      --text-dim: #8b909a;
      --accent: #ff8a3d;
      --accent-ink: #1a1006;
      --accent-2: #5eb8c9;
      --focus: #5eb8c9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c;
    --surface: #1e2126;
    --surface-2: #262a31;
    --border: #33383f;
    --text: #e8e6e1;
    --text-dim: #8b909a;
    --accent: #ff8a3d;
    --accent-ink: #1a1006;
    --accent-2: #5eb8c9;
    --focus: #5eb8c9;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .titlebar {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .wordmark {
    font-family: "Big Shoulders", sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
  }
  .wordmark .accent-i { color: var(--accent); }
  .tagline {
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .phase-badge {
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 3px;
    padding: 3px 8px;
    white-space: nowrap;
  }

  .app {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }

  .rail {
    flex: 0 0 260px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: var(--surface);
    min-width: 0;
  }
  @media (max-width: 700px) {
    .app { flex-direction: column; }
    .rail { flex: 0 0 auto; max-height: 42vh; border-right: none; border-bottom: 1px solid var(--border); }
  }

  .dropzone {
    margin: 12px;
    padding: 18px 12px;
    border: 1.5px dashed var(--border);
    border-radius: 6px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: var(--surface-2);
    color: var(--text);
  }
  .dropzone strong { color: var(--text); font-weight: 600; }
  .dropzone input[type="file"] { display: none; }

  .rail-section-label {
    padding: 0 12px;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .rail-clear {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 2px 4px;
  }
  .rail-clear:hover { color: var(--accent); }

  .part-list {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .part-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid transparent;
  }
  .swatch {
    flex: 0 0 12px;
    width: 12px; height: 12px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
  }
  .part-meta { min-width: 0; flex: 1 1 auto; }
  .part-name {
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .part-stats {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .example-tag {
    font-size: 9.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid var(--accent-2);
    border-radius: 3px;
    padding: 1px 5px;
    flex: 0 0 auto;
  }
  .empty-hint {
    padding: 16px 12px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .viewport-wrap {
    flex: 1 1 auto;
    position: relative;
    min-width: 0;
    background: var(--bg);
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }

  .view-controls {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 6px;
  }
  .view-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 11.5px;
    font-weight: 500;
    border-radius: 5px;
    padding: 6px 11px;
    cursor: pointer;
  }
  .view-btn:hover { border-color: var(--accent); color: var(--accent); }

  .hint-overlay {
    position: absolute;
    left: 14px;
    bottom: 14px;
    font-size: 11px;
    color: var(--text-dim);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 9px;
    pointer-events: none;
  }

  .readout {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 8px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    overflow-x: auto;
    white-space: nowrap;
  }
  .readout b { color: var(--text); font-weight: 500; }
  .readout .unit { color: var(--text-dim); font-size: 10px; }
  .readout-sep { color: var(--border); }
</style>

<div class="titlebar">
  <div class="wordmark">INTERLOCK<span class="accent-i">3D</span></div>
  <div class="tagline">multi-part STL viewer</div>
  <div class="phase-badge">WEB BUILD &middot; PHASE 1 OF 8</div>
</div>

<div class="app">
  <div class="rail">
    <label class="dropzone" id="dropzone">
      <div><strong>Drop STL files</strong> here</div>
      <div>or click to browse</div>
      <input type="file" id="fileInput" accept=".stl" multiple>
    </label>
    <div class="rail-section-label">
      <span id="partCountLabel">Loaded parts</span>
      <button class="rail-clear" id="clearBtn" type="button">Clear</button>
    </div>
    <div class="part-list" id="partList"></div>
  </div>

  <div class="viewport-wrap">
    <canvas id="glcanvas"></canvas>
    <div class="view-controls">
      <button class="view-btn" id="resetViewBtn" type="button">Reset View</button>
    </div>
    <div class="hint-overlay">drag to orbit &middot; scroll to zoom &middot; shift+drag to pan</div>
  </div>
</div>

<div class="readout" id="readout"></div>

    fitCameraToScene();
  }

  /* ---------- UI: part list + readout ---------- */
  var partListEl = document.getElementById("partList");
  var partCountLabelEl = document.getElementById("partCountLabel");
  var readoutEl = document.getElementById("readout");

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }
  function fmtMM(n) { return n.toFixed(1); }

  function renderPartList() {
    partCountLabelEl.textContent = "Loaded parts (" + parts.length + ")";
    partListEl.innerHTML = "";
    if (parts.length === 0) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "No parts loaded. Drop STL files above, or click to browse.";
      partListEl.appendChild(hint);
      return;
    }
    parts.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "part-row";
      var sw = document.createElement("div");
      sw.className = "swatch";
      sw.style.background = p.color.hex;
      sw.title = p.color.name;
      var meta = document.createElement("div");
      meta.className = "part-meta";
      var nameEl = document.createElement("div");
      nameEl.className = "part-name";
      nameEl.textContent = p.name;
      nameEl.title = p.name;
      var statsEl = document.createElement("div");
      statsEl.className = "part-stats";
      statsEl.textContent = p.triCount.toLocaleString() + " tris · " + fmtBytes(p.sizeBytes);
      meta.appendChild(nameEl);
      meta.appendChild(statsEl);
      row.appendChild(sw);
      row.appendChild(meta);
      if (p.isExample) {
        var tag = document.createElement("div");
        tag.className = "example-tag";
        tag.textContent = "example";
        row.appendChild(tag);
      }
      partListEl.appendChild(row);
    });
  }

  function updateReadout() {
    if (parts.length === 0) {
      readoutEl.innerHTML = '<span>No parts loaded</span>';
      return;
    }
    var totalTris = parts.reduce(function (s, p) { return s + p.triCount; }, 0);
    var b = sceneBounds;
    var w = b.max[0] - b.min[0], d = b.max[1] - b.min[1], h = b.max[2] - b.min[2];
    readoutEl.innerHTML =
      '<span>PARTS <b>' + parts.length + '</b></span>' +
      '<span class="readout-sep">|</span>' +
      '<span>TRIANGLES <b>' + totalTris.toLocaleString() + '</b></span>' +
      '<span class="readout-sep">|</span>' +
      '<span>BBOX <b>' + fmtMM(w) + '</b><span class="unit">mm</span> &times; <b>' + fmtMM(d) + '</b><span class="unit">mm</span> &times; <b>' + fmtMM(h) + '</b><span class="unit">mm</span></span>';
  }

  /* ---------- file input / drag-drop wiring ---------- */
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  fileInput.addEventListener("change", function () {
    Array.prototype.forEach.call(fileInput.files, loadFile);
    fileInput.value = "";
  });
  ["dragenter", "dragover"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.add("drag-over"); });
  });
  ["dragleave", "drop"].forEach(function (evt) {
    dropzone.addEventListener(evt, function (e) { e.preventDefault(); dropzone.classList.remove("drag-over"); });
  });
  dropzone.addEventListener("drop", function (e) {
    var files = e.dataTransfer.files;
    Array.prototype.forEach.call(files, function (f) {
      if (/\.stl$/i.test(f.name)) loadFile(f);
    });
  });
  var viewportWrap = document.querySelector(".viewport-wrap");
  ["dragenter", "dragover"].forEach(function (evt) {
    viewportWrap.addEventListener(evt, function (e) { e.preventDefault(); });
  });
  viewportWrap.addEventListener("drop", function (e) {
    e.preventDefault();
    var files = e.dataTransfer.files;
    Array.prototype.forEach.call(files, function (f) {
      if (/\.stl$/i.test(f.name)) loadFile(f);
    });
  });

  document.getElementById("clearBtn").addEventListener("click", clearParts);
  document.getElementById("resetViewBtn").addEventListener("click", fitCameraToScene);

  /* ---------- orbit camera controls ---------- */
  var dragging = false, panning = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", function (e) {
    canvas.setPointerCapture(e.pointerId);
    lastX = e.clientX; lastY = e.clientY;
    panning = e.shiftKey || e.button === 1 || e.button === 2;
    dragging = true;
  });
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    if (panning) {
      var offDir = [
        Math.sin(camPhi) * Math.cos(camTheta),
        Math.sin(camPhi) * Math.sin(camTheta),
        Math.cos(camPhi)
      ];
      var worldUp = [0, 0, 1];
      var right = [
        worldUp[1] * offDir[2] - worldUp[2] * offDir[1],
        worldUp[2] * offDir[0] - worldUp[0] * offDir[2],
        worldUp[0] * offDir[1] - worldUp[1] * offDir[0]
      ];
      var rl = Math.hypot(right[0], right[1], right[2]) || 1;
      right = [right[0] / rl, right[1] / rl, right[2] / rl];
      var camUp = [
        offDir[1] * right[2] - offDir[2] * right[1],
        offDir[2] * right[0] - offDir[0] * right[2],
        offDir[0] * right[1] - offDir[1] * right[0]
      ];
      var panScale = camRadius * 0.0016;
      camTarget = [
        camTarget[0] - right[0] * dx * panScale + camUp[0] * dy * panScale,
        camTarget[1] - right[1] * dx * panScale + camUp[1] * dy * panScale,
        camTarget[2] - right[2] * dx * panScale + camUp[2] * dy * panScale
      ];
    } else {
      camTheta -= dx * 0.006;
      camPhi -= dy * 0.006;
      var eps = 0.04;
      if (camPhi < eps) camPhi = eps;
      if (camPhi > Math.PI - eps) camPhi = Math.PI - eps;
    }
  });
  window.addEventListener("pointerup", function () { dragging = false; panning = false; });
  canvas.addEventListener("wheel", function (e) {
    e.preventDefault();
    var factor = Math.exp(e.deltaY * 0.0012);
    camRadius = Math.min(MAX_RADIUS, Math.max(MIN_RADIUS, camRadius * factor));
  }, { passive: false });

  /* ---------- resize ---------- */
  function resizeCanvas() {
    var rect = viewportWrap.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.round(rect.width * dpr));
    var h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
  }
  new ResizeObserver(resizeCanvas).observe(viewportWrap);
  resizeCanvas();

  /* ---------- render loop ---------- */
  function render() {
    resizeCanvas();
    gl.viewport(0, 0, canvas.width, canvas.height);
    var dark = bgIsDark();
    if (dark) gl.clearColor(0x16 / 255, 0x18 / 255, 0x1c / 255, 1);
    else gl.clearColor(0xf2 / 255, 0xf0 / 255, 0xea / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    var aspect = canvas.width / canvas.height || 1;
    var proj = mat4Perspective(Math.PI / 4, aspect, Math.max(camRadius * 0.01, 0.1), camRadius * 20 + 100);
    var eye = [
      camTarget[0] + camRadius * Math.sin(camPhi) * Math.cos(camTheta),
      camTarget[1] + camRadius * Math.sin(camPhi) * Math.sin(camTheta),
      camTarget[2] + camRadius * Math.cos(camPhi)
    ];
    var view = mat4LookAt(eye, camTarget, [0, 0, 1]);
    var viewProj = mat4Multiply(proj, view);

    if (gridVertCount > 0) {
      gl.useProgram(lineProgram);
      gl.uniformMatrix4fv(lineLoc.viewProj, false, viewProj);
      var gc = dark ? [0.28, 0.30, 0.34, 1] : [0.78, 0.76, 0.70, 1];
      gl.uniform4fv(lineLoc.color, gc);
      gl.bindVertexArray(gridVao);
      gl.drawArrays(gl.LINES, 0, gridVertCount);
      gl.bindVertexArray(null);
    }

    gl.useProgram(meshProgram);
    gl.uniformMatrix4fv(meshLoc.viewProj, false, viewProj);
    gl.uniform1f(meshLoc.alpha, 1.0);
    parts.forEach(function (p) {
      gl.uniform3fv(meshLoc.color, hexToRgb01(p.color.hex));
      gl.bindVertexArray(p.vao);
      gl.drawArrays(gl.TRIANGLES, 0, p.vertCount);
      gl.bindVertexArray(null);
    });

    requestAnimationFrame(render);
  }

  renderPartList();
  updateReadout();
  loadExamples();
  requestAnimationFrame(render);
})();
</script>
