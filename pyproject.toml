[project]
name = "interlock3d"
version = "0.1.0"
description = "Detect and compensate mating features in multi-part STL files for FDM 3D printing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "trimesh>=4.0",
    "numpy>=1.26",
]

[project.scripts]
interlock3d = "interlock3d.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
