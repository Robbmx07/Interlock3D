[project]
name = "interlock3d"
version = "0.1.0"
description = "Detect and compensate mating features in multi-part STL files for FDM 3D printing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "trimesh>=4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyransac3d>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
interlock3d = "interlock3d.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interlock3d = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
